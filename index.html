/*FONT-END*/
  :root{--bg:#17102a;--panel:#241a3d;--panel2:#31245a;--line:#5a4a9a;--text:#f0e8ff;--dim:#a99bd0;--gold:#ffd166;--fs:24px;--fb:24px;--p:3px;--cur:auto}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Cubic11',monospace;font-size:var(--fs);line-height:1.35;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;cursor:var(--cur)}
  /* 像素框：四邊各一條 3px 實色線，四個角是缺的（階梯狀），再加上內側的亮暗邊，做出掌機按鈕的凹凸感 */
  .px{border:0;margin:var(--p);background:var(--panel);color:var(--text);
      box-shadow:0 calc(var(--p)*-1) 0 0 var(--line),0 var(--p) 0 0 var(--line),calc(var(--p)*-1) 0 0 0 var(--line),var(--p) 0 0 0 var(--line),
                 inset 0 calc(var(--p)*-1) 0 0 rgba(0,0,0,.4),inset 0 var(--p) 0 0 rgba(255,255,255,.12)}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
  #hud{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;justify-content:center;min-height:var(--fs);text-shadow:2px 2px 0 #000}
  #hud b{color:var(--gold);font-weight:400}
  #hud .chips{display:flex;gap:6px}
  #hud .chip{background:var(--panel);padding:0 5px;box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
  #wrap{display:inline-block;line-height:0;margin:6px;background:#000;box-shadow:0 -6px 0 0 var(--line),0 6px 0 0 var(--line),-6px 0 0 0 var(--line),6px 0 0 0 var(--line),0 -9px 0 -3px #000,0 9px 0 -3px #000,-9px 0 0 -3px #000,9px 0 0 -3px #000}
  #w{display:block;image-rendering:pixelated;cursor:none;touch-action:none}
  /* 工具列：兩排。上排是「對世界做的事」（工具）；下排是「控制」：時間、視角、資訊面板、選單。每組之間留出間距 */
  #tools{display:flex;flex-direction:column;align-items:center;gap:0}
  .trow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 20px}
  .grp{display:flex;align-items:center;flex-wrap:nowrap}
  .grp.seg .px{margin-left:0;margin-right:0}
  .grp.seg .px+ .px{margin-left:calc(var(--p)*2)}
  .grp .sp{padding:6px 10px}
  .grp .ico{padding:6px 10px}
  #menu{position:fixed;right:10px;bottom:10px;width:min(260px,92vw);z-index:9;background:#1f1636;padding:12px 14px;font-size:calc(var(--fb)*.5);
        box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 -7px 0 -3px #000,0 7px 0 -3px #000,-7px 0 0 -3px #000,7px 0 0 -3px #000}
  #menu[hidden]{display:none}
  #menu h3{margin:0 0 6px;font-weight:400;color:var(--dim)}
  #menu button{display:block;width:100%;text-align:left;margin:6px 0;padding:5px 8px}
  #menu p{margin:8px 0 0;color:var(--dim);line-height:1.5;font-size:.9em}
  @media (max-width:1100px){.lb2{display:none}}
  @media (max-width:640px){.lb{display:none}}
  button{font:inherit;line-height:1.2;color:inherit;cursor:var(--cur);white-space:nowrap;padding:8px 14px;letter-spacing:0;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
  button:hover{background:var(--panel2)}
  button:active{transform:translateY(var(--p));box-shadow:0 calc(var(--p)*-1) 0 0 var(--line),0 var(--p) 0 0 var(--line),calc(var(--p)*-1) 0 0 0 var(--line),var(--p) 0 0 0 var(--line),inset 0 var(--p) 0 0 rgba(0,0,0,.4)}
  button.on{background:var(--gold);color:#2a1a00;text-shadow:none}
  button.on:hover{background:#ffe08a}
  .ic{display:inline-block;image-rendering:pixelated;vertical-align:-3px;margin-right:6px}
  .ic:last-child{margin-right:0}
  /* 對話框與遮罩：用棋盤格點陣取代半透明模糊，才是像素風的「暗化」 */
  .modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
         background:repeating-conic-gradient(rgba(10,6,22,.9) 0% 25%,rgba(10,6,22,.55) 0% 50%) 0 0/4px 4px}
  .modal[hidden]{display:none}
  .card{max-width:760px;width:100%;max-height:96vh;overflow:auto;background:#1f1636;padding:24px 28px;font-size:var(--fb);margin:6px;
        box-shadow:0 -6px 0 0 var(--line),0 6px 0 0 var(--line),-6px 0 0 0 var(--line),6px 0 0 0 var(--line),0 -9px 0 -3px #000,0 9px 0 -3px #000,-9px 0 0 -3px #000,9px 0 0 -3px #000}
  .card h1{margin:0 0 8px;font-size:var(--fb);font-weight:400;color:var(--gold);text-shadow:3px 3px 0 #000}
  .card h2{margin:0 0 4px;font-size:calc(var(--fb)*.5);font-weight:400;color:var(--dim)}
  .card p{margin:10px 0}
  .card .q{color:#fff;margin:12px 0 18px}
  .card .opts{display:flex;flex-direction:column;gap:8px}
  .card .opts button{text-align:left;white-space:normal}
  .card .row{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
  .card .row button{flex:1;min-width:120px}
  .card .row button.main{background:var(--gold);color:#2a1a00;text-shadow:none}
  #flt{position:fixed;right:10px;top:64px;width:min(320px,92vw);max-height:76vh;overflow:auto;z-index:8;background:#1f1636;padding:12px 14px;font-size:calc(var(--fb)*.55);
       box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 -7px 0 -3px #000,0 7px 0 -3px #000,-7px 0 0 -3px #000,7px 0 0 -3px #000}
  #flt[hidden],#scl[hidden]{display:none}
  #scl{position:fixed;left:10px;top:64px;width:min(210px,80vw);z-index:8;background:#1f1636;padding:12px 14px;font-size:calc(var(--fb)*.5);

  mk('b-pause', '', () => { paused = !paused; syncTools(); }, 'ico', gS, L('暫停 / 繼續 (空白鍵)', 'Pause / resume (Space)'));
  for (const v of [1, 3, 10, 30, 100]) mk('sp' + v, v + '×', () => { speed = v; syncTools(); }, 'sp', gS, L('時間流速', 'Speed'));
  mk('z-out', '-', () => zoomAt(-1, W/2, H/2), 'ico', gV, L('縮小 (-)', 'Zoom out (-)')); mk('z-in', '+', () => zoomAt(1, W/2, H/2), 'ico', gV, L('放大 (+)', 'Zoom in (+)'));
  mk('b-flt', ic('spark', 2) + `<span class="lb2">${L('篩選', 'Filter')}</span>`, toggleFlt, 'ico', gP, L('篩選並標示 (F)', 'Filter & highlight (F)'));
  mk('b-ach', ic('look', 2) + `<span class="lb2">${L('成就', 'Trophies')}</span>`, openAch, 'ico', gP, L('成就與紀錄', 'Achievements & records'));
  mk('b-hist', ic('scroll', 2) + `<span class="lb2">${L('歷史', 'History')}</span>`, openHist, 'ico', gP, L('世界歷史 (H)', 'World history (H)'));
  mk('b-menu', ic('arrow', 2) + `<span class="lb2">${L('選單', 'Menu')}</span>`, toggleMenu, 'ico', gP, L('聲音、語言、重來', 'Sound, language, reset'));
  // 選單：不常用的設定
  const mh = document.createElement('h3'); mh.textContent = L('選單', 'Menu'); $('menu').appendChild(mh);
  mk('b-mus', '', () => { AUD.on = !AUD.on; try { localStorage.setItem('sw-mus', AUD.on ? '1' : '0'); } catch (e) {} syncTools(); }, '', $('menu'));
  mk('b-mute', '', () => { muted = !muted; syncTools(); }, '', $('menu'));
  mk('b-lang', ic('speech', 2) + (lang === 'en' ? '中文' : 'English'), () => setLang(lang === 'en' ? 'zh' : 'en'), '', $('menu'));
  mk('b-new', ic('no', 2) + L('重來（清除進度）', 'Reset (clear progress)'), () => { $('menu').hidden = true; askYesNo(L('要清除進度重新開始嗎？', 'Clear progress and start over?'), () => { try { localStorage.removeItem('sw-save'); } catch (e) {} newGame(); }); }, '', $('menu'));
  const kp = document.createElement('p'); kp.textContent = L('快捷鍵：1–6 工具 ・ F 篩選 ・ H 歷史 ・ 空白鍵 暫停 ・ + / - 縮放 ・ 0 還原 ・ 方向鍵 / WASD 平移 ・ Esc 關閉', 'Keys: 1–6 tools · F filter · H history · Space pause · + / - zoom · 0 reset · arrows / WASD pan · Esc close'); $('menu').appendChild(kp);
  $('i-t').innerHTML = ic('chick', 4) + L('小群', 'Swarmlings');
  $('i-p1').textContent = L('你在一片草地上發現了一隻毛茸茸的小生物。牠看起來有點餓，有點髒，也有點無聊。', 'You found a fuzzy little creature in a meadow. It looks a bit hungry, a bit dirty, and a bit bored.');
  $('i-p2').textContent = L('這裡有很多果子和水，牠會自己生活、繁殖。你可以什麼都不做，只是看；也可以餵牠、洗澡、陪玩、摸摸。', "There is plenty of fruit and water here; it will live and multiply on its own. Just watch — or feed, wash, play and pet if you like.");
  $('i-go').textContent = L('開始', 'Start');
  for (const b of document.querySelectorAll('[data-lang]')) b.classList.toggle('on', b.dataset.lang === lang);
  syncTools(); fit(); if (!$('flt').hidden) buildFlt();
}
function syncTools() {
  for (const t of ['feed', 'wash', 'play', 'pet', 'look', 'sculpt']) $('t-' + t).classList.toggle('on', tool === t);
  for (const v of [1, 3, 10, 30, 100]) $('sp' + v).classList.toggle('on', speed === v);
  $('b-pause').innerHTML = ic(paused ? 'play' : 'pause', 2); $('b-pause').classList.toggle('on', paused);
  $('b-mute').innerHTML = ic(muted ? 'mute' : 'sound', 2) + (muted ? L('聲音：關', 'Sound: off') : L('聲音：開', 'Sound: on')); $('b-mus').innerHTML = ic('note', 2) + (AUD.on ? L('音樂：開', 'Music: on') : L('音樂：關', 'Music: off')); $('b-mus').classList.toggle('on', AUD.on);
}
function setTool(t) { tool = t; syncTools(); $('scl').hidden = t !== 'sculpt'; if (t === 'sculpt') buildScl(); }
function setLang(l) { lang = l; try { localStorage.setItem('sw-lang', l); } catch (e) {} buildUI(); }
function updateHud() {
  const cap = capacity(), dn = Math.floor(S.t/DAY) + 1;
  const stage = { pet: L('起步', 'Start'), throng: L('群體', 'Throng'), awake: L('覺醒', 'Awake'), done: L('覺醒', 'Awake') }[S.phase];
  let h = `<span>${ic(darkness() > 0.6 ? 'moon' : 'sun', 2)}${L('第', 'Day')} <b>${dn}</b>${L(' 天', '')} ${L(SEA_NAME[season()][0], SEA_NAME[season()][1])}</span><span>${ic('people', 2)}<b>${pop()}</b>/${cap}</span><span>${L('階段', 'Stage')} <b>${stage}</b></span>`;
  if (auto()) h += `<span>${ic('apple', 2)}<b>${S.stock.apple}</b> ${ic('log', 2)}<b>${S.stock.wood}</b> ${ic('stone', 2)}<b>${S.stock.stone}</b></span>`;
  if (S.ev) h += `<span class="chip">${ic(EVENTS[S.ev.type].ic, 2)}${L(EVENTS[S.ev.type].zh, EVENTS[S.ev.type].en)}</span>`;
  const ds = Object.keys(DISC).filter(k => S.disc[k]).map(k => `<span class="chip" title="${L(DISC[k].zh, DISC[k].en)}">${ic(DISC[k].ic, 2)}${L(DISC[k].zh, DISC[k].en)}</span>`).join('');
  if (ds) h += `<span class="chips">${ds}</span>`;
  if (updateHud.last !== h) { $('hud').innerHTML = h; updateHud.last = h; fit(); }
}

// ---------- 版面 ----------
let scale = 3;
function fit() {   // 盡量用整數倍放大，像素才不會糊
  const availW = innerWidth - 64, availH = innerHeight - $('hud').offsetHeight - $('tools').offsetHeight - 84;
  let s = Math.min(availW/W, availH/H); s = s >= 2 ? Math.floor(s) : s >= 1 ? Math.floor(s*2)/2 : s;   // 手機上世界比螢幕寬，只好用小數倍縮小
  scale = s; cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px';
}
addEventListener('resize', fit);

// ---------- 輸入 ----------
function spos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left)/r.width*W, y: (e.clientY - r.top)/r.height*H }; }
function wpos(e) { const p = spos(e); return { x: cam.x + p.x/cam.z, y: cam.y + p.y/cam.z, sx: p.x, sy: p.y }; }
const setMouse = p => { mouse.x = p.x; mouse.y = p.y; mouse.sx = p.sx; mouse.sy = p.sy; };
const ptrs = new Map(); let pinch = null;   // 觸控：雙指縮放
let pan = null;   // 拖曳平移：右鍵／中鍵，或餵食與玩球工具下的左鍵拖曳
const blocked = () => dlgOpen || resOpen || histOpen || S.ritual;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (blocked()) return; const p = wpos(e); setMouse(p); mouse.down = true;
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pan = null; pinch = { d: Math.hypot(a.sx - b.sx, a.sy - b.sy) || 1 }; return; }   // 第二根手指落下：取消點擊，改成縮放
  if (pinch) return;
  if (e.button === 1 || e.button === 2) { pan = { sx: p.sx, sy: p.sy, cx: cam.x, cy: cam.y, moved: true, act: false }; return; }
  if (tool === 'feed' || tool === 'play' || tool === 'look' || tool === 'sculpt') pan = { sx: p.sx, sy: p.sy, cx: cam.x, cy: cam.y, moved: false, act: true, wx: p.x, wy: p.y };   // 沒有拖動才算「點一下」
  else act(p.x, p.y, false);
});
cv.addEventListener('pointermove', e => {
  const p = wpos(e); setMouse(p); mouse.in = true;
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.sx - b.sx, a.sy - b.sy) || 1, mx = (a.sx + b.sx)/2, my = (a.sy + b.sy)/2;
    if (d/pinch.d > 1.35) { zoomAt(1, mx, my); pinch.d = d; } else if (d/pinch.d < 0.74) { zoomAt(-1, mx, my); pinch.d = d; }
    return;
  }
  if (pan) {
    const dx = p.sx - pan.sx, dy = p.sy - pan.sy;
    if (!pan.moved && Math.hypot(dx, dy) > 3 && cam.z > 1) pan.moved = true;
    if (pan.moved) { cam.x = pan.cx - dx/cam.z; cam.y = pan.cy - dy/cam.z; clampCam(); }
  } else if (mouse.down && (tool === 'pet' || tool === 'wash') && !blocked()) act(p.x, p.y, true);
});
cv.addEventListener('pointerleave', () => { mouse.in = false; });
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = ptrs.size ? pinch : null; };
addEventListener('pointercancel', endPtr);
addEventListener('pointerup', e => { const was = !!pinch; endPtr(e); if (was) { pan = null; mouse.down = false; return; } mouse.down = false; if (pan && pan.act && !pan.moved && !blocked()) act(pan.wx, pan.wy, false); pan = null; });
let wheelAcc = 0;
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (S.ritual) return;
  wheelAcc += e.deltaY*(e.deltaMode === 1 ? 33 : 1);   // 觸控板會一次送出很多小量，累積到門檻才算一格
  if (Math.abs(wheelAcc) < 40) return; const dir = wheelAcc < 0 ? 1 : -1; wheelAcc = 0;
  const p = spos(e); zoomAt(dir, p.x, p.y); const q = wpos(e); setMouse(q);
}, { passive: false });
addEventListener('keydown', e => {
  if (e.code === 'Digit1') setTool('feed'); else if (e.code === 'Digit2') setTool('wash'); else if (e.code === 'Digit3') setTool('play'); else if (e.code === 'Digit4') setTool('pet'); else if (e.code === 'Digit5') setTool('look'); else if (e.code === 'Digit6') setTool('sculpt');
  else if (e.code === 'KeyF' && !S.ritual && !resOpen && !dlgOpen && !histOpen) toggleFlt();
  else if (e.code === 'KeyH' && !S.ritual && !resOpen && !dlgOpen) { if (histOpen) $('h-x').click(); else openHist(); }
  else if (e.code === 'Escape' && histOpen) { $('h-x').click(); $('a-x').click(); }
  else if (e.code === 'Escape' && (!$('flt').hidden || !$('menu').hidden)) { $('flt').hidden = true; $('menu').hidden = true; }
  else if (e.code === 'Space') { paused = !paused; syncTools(); e.preventDefault(); }
  else if (!S.ritual && ['Equal', 'NumpadAdd'].includes(e.code)) zoomAt(1, W/2, H/2);
  else if (!S.ritual && ['Minus', 'NumpadSubtract'].includes(e.code)) zoomAt(-1, W/2, H/2);
  else if (e.code === 'Digit0') { cam.z = 1; clampCam(); }
  else if (!S.ritual && cam.z > 1 && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) {
    const st = 36/cam.z; cam.x += ['ArrowRight', 'KeyD'].includes(e.code) ? st : ['ArrowLeft', 'KeyA'].includes(e.code) ? -st : 0; cam.y += ['ArrowDown', 'KeyS'].includes(e.code) ? st : ['ArrowUp', 'KeyW'].includes(e.code) ? -st : 0; clampCam(); e.preventDefault(); }
});
for (const b of document.querySelectorAll('[data-lang]')) b.onclick = () => setLang(b.dataset.lang);
function startHint() { if (S.t < 1 && S.stats.fed === 0) { showBanner('放著就會自己生活；也可以選工具照顧牠。滾輪縮放', 'They live on their own. Use the tools to help; scroll to zoom', 6000, 'apple'); } }
$('i-go').onclick = () => { $('intro').hidden = true; try { localStorage.setItem('sw-seen', '1'); } catch (e) {} startHint(); };
$('r-cont').onclick = () => { $('res').hidden = true; resOpen = false; S.ritual = null; S.phase = 'done'; S.stareT = 30; for (const c of S.creatures) { c.st = 'idle'; c.tt = 1; } };
$('r-new').onclick = () => { $('res').hidden = true; resOpen = false; try { localStorage.removeItem('sw-save'); } catch (e) {} newGame(); };
$('r-copy').onclick = () => { try { navigator.clipboard.writeText(S.resultText); $('r-copy').textContent = L('已複製', 'Copied!'); } catch (e) {} };

// ---------- 存檔 ----------
function save() {
  if (!S || S.ritual || resOpen) return;
  try {
    const o = { ...S, creatures: S.creatures.map(c => ({ ...c, goal: null, home: null, st: c.st === 'sleep' ? 'sleep' : 'idle', bub: null })), builds: S.builds.map(b => ({ ...b, occ: [] })), plan: S.plan, ball: null, log: [], resultText: undefined };
    localStorage.setItem('sw-save', JSON.stringify(o));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem('sw-save') || 'null');
    if (s && s.v === 2 && s.creatures.length) {
      S = s; genWorld(S.seed); curSea = -1; buildGround(); initFauna();   // 地形由種子重新生成；樹、石與建築的狀態來自存檔
      S.editsW = S.editsW || []; for (const [i, v] of S.editsW) WORLD.field[i] = v;   // 玩家挖的池塘、填平的水，重新套用到水位場
      S.ev = S.ev || null; S.evCd = S.evCd ?? 300; S.hist = S.hist || []; S.peak = S.peak || pop(); S.graves = S.graves || []; for (const c of S.creatures) { c.gen = c.gen || 1; c.par = c.par || 0; if (!c.life) c.life = c.age + rnd(500, 1300); }   // 舊存檔補上壽命與世代
      S.log = []; S.ritual = null; S.homesT = 0; S.rain = S.rain || 0; S.rainCd = S.rainCd || 100;
      for (const b of S.builds) b.occ = [];
      fixOrchards(); loadRoads(); rebuildRoads();
      if (S.phase === 'awake' && S.q >= QS.length) S.phase = 'done';
      return true;
    }
  } catch (e) {}
  return false;
}

// ---------- 主迴圈 ----------
let last = performance.now(), acc = 0;
const ground2 = document.createElement('canvas'); ground2.width = W; ground2.height = H; let fade = 0, curSea = -1;
function checkSeason(announce) {   // 季節一換，就重畫地表並交叉淡入
  const se = season(); if (se === curSea) return;
  if (announce && curSea >= 0) { ground2.getContext('2d').drawImage(ground, 0, 0); fade = 1; showBanner(SEA_NAME[se][0] + '天來了', SEA_NAME[se][1] + ' has come', 2600); logMsg(SEA_NAME[se][0] + '天來了', SEA_NAME[se][1] + ' has come'); }
  if (announce && curSea >= 0 && S.hist) { const yr = Math.floor(S.t/(SEASON_LEN*4)); S.hs = S.hs || {};
    if (se === 3 && !S.hs['w' + yr]) { S.hs['w' + yr] = 1; addHist(`第 ${yr + 1} 個冬天來臨。`, `Winter ${yr + 1} arrived.`); }
    if (se === 0 && yr > 0 && !S.hs['s' + yr]) { S.hs['s' + yr] = 1; addHist(`度過了第 ${yr} 個冬天，春天回來了。`, `Survived winter ${yr}. Spring returned.`, 'sun'); } }
  curSea = se; applyWater(TIDE[se] + evTide()); buildGround();
}
function frame(now) {
  // 對話框開著時時間暫停：否則加速時，小生物會在你思考時餓死
  const dt = Math.min(0.25, (now - last)/1000); last = now;
  if (!paused && !resOpen && !dlgOpen && !histOpen) { const tk = speed >= 30 ? 0.1 : speed >= 10 ? 1/15 : TICK; acc += dt*speed; let n = 0; while (acc >= tk && n++ < 600) { step(tk); acc -= tk; } if (acc > tk*600) acc = 0; }   // 越快，每一步越粗，運算量反而不增加
  if (sel != null && S && cam.z > 1 && !pan) { const c = S.creatures.find(o => o.id === sel); if (c) { cam.x += (c.x - W/cam.z/2 - cam.x)*0.15; cam.y += (c.y - H/cam.z/2 - cam.y)*0.15; clampCam(); } }   // 放大時鏡頭跟著被查看的小生物
  if (S) checkSeason(true); fade = Math.max(0, fade - dt/1.6);
  audioTick(); render(now/1000); updateHud();
  requestAnimationFrame(frame);
}
const qs = new URLSearchParams(location.search);
if (qs.get('seed') || !load()) newGame(+qs.get('seed') || undefined);
if (+qs.get('speed')) speed = +qs.get('speed');
buildUI();
try { if (!localStorage.getItem('sw-seen') && qs.get('intro') !== '0') $('intro').hidden = false; else startHint(); } catch (e) {}
setInterval(save, 8000);
addEventListener('beforeunload', save);
(function () {   // 像素滑鼠游標（放大兩倍）與網站圖示
  const a = icCanvas('arrow'), c = document.createElement('canvas'); c.width = a.width*2; c.height = a.height*2;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(a, 0, 0, c.width, c.height);
  document.documentElement.style.setProperty('--cur', `url(${c.toDataURL()}) 0 0, auto`);
  document.querySelector('link[rel=icon]').href = icCanvas('chick').toDataURL();
})();
const startLoop = () => { fit(); requestAnimationFrame(frame); };   // 像素字體是嵌在檔案裡的，載入很快；最多等 1.5 秒
try { Promise.race([document.fonts.load('12px Cubic11'), new Promise(r => setTimeout(r, 1500))]).then(startLoop, startLoop); } catch (e) { startLoop(); }
</script>
</body>
