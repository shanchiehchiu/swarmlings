  :root{--bg:#17102a;--panel:#241a3d;--panel2:#31245a;--line:#5a4a9a;--text:#f0e8ff;--dim:#a99bd0;--gold:#ffd166;--fs:24px;--fb:24px;--p:3px;--cur:auto}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Cubic11',monospace;font-size:var(--fs);line-height:1.35;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;cursor:var(--cur)}
  /* 像素框：四邊各一條 3px 實色線，四個角是缺的（階梯狀），再加上內側的亮暗邊，做出掌機按鈕的凹凸感 */
  .px{border:0;margin:var(--p);background:var(--panel);color:var(--text);
      box-shadow:0 calc(var(--p)*-1) 0 0 var(--line),0 var(--p) 0 0 var(--line),calc(var(--p)*-1) 0 0 0 var(--line),var(--p) 0 0 0 var(--line),
                 inset 0 calc(var(--p)*-1) 0 0 rgba(0,0,0,.4),inset 0 var(--p) 0 0 rgba(255,255,255,.12)}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
  #hud{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;justify-content:center;min-height:var(--fs);text-shadow:2px 2px 0 #000}
  #hud b{color:var(--gold);font-weight:400}
  #hud .chips{display:flex;gap:6px}
  #hud .chip{background:var(--panel);padding:0 5px;box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
  #wrap{display:inline-block;line-height:0;margin:6px;background:#000;box-shadow:0 -6px 0 0 var(--line),0 6px 0 0 var(--line),-6px 0 0 0 var(--line),6px 0 0 0 var(--line),0 -9px 0 -3px #000,0 9px 0 -3px #000,-9px 0 0 -3px #000,9px 0 0 -3px #000}
  #w{display:block;image-rendering:pixelated;cursor:none;touch-action:none}
  /* 工具列：兩排。上排是「對世界做的事」（工具）；下排是「控制」：時間、視角、資訊面板、選單。每組之間留出間距 */
  #tools{display:flex;flex-direction:column;align-items:center;gap:0}
  .trow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 20px}
  .grp{display:flex;align-items:center;flex-wrap:nowrap}
  .grp.seg .px{margin-left:0;margin-right:0}
  .grp.seg .px+ .px{margin-left:calc(var(--p)*2)}
  .grp .sp{padding:6px 10px}
  .grp .ico{padding:6px 10px}
  #menu{position:fixed;right:10px;bottom:10px;width:min(260px,92vw);z-index:9;background:#1f1636;padding:12px 14px;font-size:calc(var(--fb)*.5);
        box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 -7px 0 -3px #000,0 7px 0 -3px #000,-7px 0 0 -3px #000,7px 0 0 -3px #000}
  #menu[hidden]{display:none}
  #menu h3{margin:0 0 6px;font-weight:400;color:var(--dim)}
  #menu button{display:block;width:100%;text-align:left;margin:6px 0;padding:5px 8px}
  #menu p{margin:8px 0 0;color:var(--dim);line-height:1.5;font-size:.9em}
  @media (max-width:1100px){.lb2{display:none}}
  @media (max-width:640px){.lb{display:none}}
  button{font:inherit;line-height:1.2;color:inherit;cursor:var(--cur);white-space:nowrap;padding:8px 14px;letter-spacing:0;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
  button:hover{background:var(--panel2)}
  button:active{transform:translateY(var(--p));box-shadow:0 calc(var(--p)*-1) 0 0 var(--line),0 var(--p) 0 0 var(--line),calc(var(--p)*-1) 0 0 0 var(--line),var(--p) 0 0 0 var(--line),inset 0 var(--p) 0 0 rgba(0,0,0,.4)}
  button.on{background:var(--gold);color:#2a1a00;text-shadow:none}
  button.on:hover{background:#ffe08a}
  .ic{display:inline-block;image-rendering:pixelated;vertical-align:-3px;margin-right:6px}
  .ic:last-child{margin-right:0}

    case 'harvest': if (g.ref && (g.ref.g || 0) >= 1) { if (!S.hist.some(h => h.zh === '第一次收成。')) addHist('第一次收成。', 'The first harvest.', 'wheat'); const yd = Math.round((S.builds.some(b => b.type === 'mill' && b.done) ? 24 : 16)*(evNow() === 'harvest' ? 1.5 : 1)); S.stock.apple += yd; S.tot.apple += yd; g.ref.g = 0; say(c, '@wheat', 1.6); sfx.eat(); } break;
    case 'mourn': say(c, '@heart', 2); break;
    case 'fish': S.stock.apple += 5; S.tot.apple += 5; say(c, '@yum', 1.4); break;
    case 'deposit': if (c.carry) { const n = c.carryN || 1; S.stock[c.carry] += n; S.tot[c.carry] += n; c.carry = null; c.carryN = 0; } break;
  }
  c.st = 'idle'; c.goal = null; c.tt = rnd(0.2, 0.8);
}

// ---------- 說話：先是符號，語言發現後是咕嚕聲，文字發現後是真正的句子 ----------
const SYL = ['ka', 'to', 'mi', 'nu', 'ru', 'pe', 'lo', 'sa', 'ti', 'mo'];
const nameOf = c => { const a = SYL[(c.id*7 + 3) % 10], b = SYL[(c.id*3 + 1) % 10], k = SYL[(c.id*5) % 10]; return (a[0].toUpperCase() + a[1]) + b + (c.id % 3 ? k : ''); };   // 依編號決定的小名
const ACT = { eatApple: ['吃東西', 'Eating'], eatStock: ['吃東西', 'Eating'], eatTree: ['摘果子', 'Picking fruit'], wash: ['洗澡', 'Bathing'], kick: ['玩球', 'Playing ball'], gather: ['採集', 'Gathering'], chop: ['伐木', 'Chopping'], mine: ['採石', 'Mining'], deposit: ['搬運', 'Carrying'], build: ['蓋房子', 'Building'], study: ['讀書', 'Studying'], chat: ['聊天', 'Chatting'], dance: ['跳舞', 'Dancing'], sleepHome: ['回家睡覺', 'Going home'], harvest: ['收成', 'Harvesting'], wander: ['閒逛', 'Wandering'] };
function babble() { const n = ri(1, 3); let s = ''; for (let i = 0; i < n; i++) s += pick(SYL) + (i < n - 1 ? '-' : ''); return s + pick(['', '?', '!']); }
function chatter(c) {
  if (S.disc.writing) {
    const pool = c.h < 45 ? [L('肚子餓了', "I'm hungry"), L('有蘋果嗎？', 'Any apples?')]
      : S.phase === 'done' || S.phase === 'awake' ? [L('你在看嗎？', 'Are you watching?'), L('我們有名字嗎？', 'Do we have names?'), L('你是誰？', 'Who are you?'), L('我們會一直在這裡嗎？', 'Will we always be here?')]
      : [L('一起蓋！', "Let's build!"), L('今天天氣真好', 'Nice day'), L('我發現了東西', 'I found something'), L('你們看', 'Look')];
    return pick(pool);
  }
  if (S.disc.language) return babble();
  if (c.h < 40) return '@apple'; if (c.c < 30) return '@bubble'; if (c.f < 35) return '@zd';
  return pick(['@note', '@heart', '@smile']);
}
function say(c, t, s = 2.4) { c.bub = t; c.bubT = s; }

// ---------- 主模擬 ----------
function step(dt) {
  S.t += dt; S.time = (S.time + dt/DAY) % 1;
  S.rainCd -= dt; if (S.rainCd <= 0) { S.rain = rnd(25, 60); S.rainCd = rnd(120, 300)*[0.8, 1.4, 0.7, 0.6][season()]; } if (S.rain > 0) S.rain -= dt;   // 偶爾下雨（只是氣氛）
  if (S.phase === 'pet' && pop() >= 8) {
    S.phase = 'throng'; S.stock.apple += 6; sfx.disc();
    logMsg('牠們開始自己找食物了。', 'They started finding food on their own.'); showBanner('牠們開始自己行動了。', 'They have started to act on their own.');
  }
  for (const n of S.nodes) {   // 資源再生
    if (n.g < 1) { n.g = Math.min(1, n.g + dt/120); continue; }
    if (n.type === 'tree') { n.at = (n.at || 0) + dt; if (n.at > (S.disc.farming ? 3 : 5)*(SEA_FRUIT[season()])/evMul()) { n.at = 0; if (n.apple < 6) n.apple++; } n.wt = (n.wt || 0) + dt; if (n.wt > 15) { n.wt = 0; if (n.wood < 4) n.wood++; } }
    else { n.rt = (n.rt || 0) + dt; if (n.rt > 20) { n.rt = 0; if (n.stone < 4) n.stone++; } }
  }
  stepFauna(dt); stepEvents(dt);
  S.achT = (S.achT || 0) - dt; if (S.achT <= 0) { S.achT = 2; checkAch(); }
  if (pop() > (S.peak || 0)) { S.peak = pop(); for (const m of [10, 25, 50, 100, 200, 300, 400]) if (S.peak >= m && !(S.pm || {})[m]) { (S.pm = S.pm || {})[m] = 1; addHist(`人口突破 ${m}。`, `Population passed ${m}.`, 'people'); } }
  S.seedT = (S.seedT || 0) - dt; if (S.seedT <= 0) { S.seedT = pop() > 150 ? 5 : 9; sprout(); }   // 森林緩慢蔓延
  for (const b of S.builds) if (b.type === 'orchard' && b.done) { b.g = season() === 3 ? 0 : Math.min(1, (b.g || 0) + dt/(SEASON_LEN*1.6)); b.rt = b.g >= 1 ? (b.rt || 0) + dt : 0; }   // 作物：春天播種、一路長到入秋成熟；冬天霜害，沒收成就歸零
  for (const a of S.apples) if (a.fall > 0) a.fall = Math.max(0, a.fall - dt*60);
  if (S.ball) {
    const b = S.ball; b.x += b.vx*dt; b.y += b.vy*dt; b.vx *= 0.97; b.vy *= 0.97; b.life -= dt;
    if (b.x < 6 || b.x > W - 6) b.vx *= -1; if (b.y < YMIN || b.y > H - 6) b.vy *= -1; b.x = clamp(b.x, 6, W - 6); b.y = clamp(b.y, YMIN, H - 6);
    if (b.life <= 0) S.ball = null;
  }
  if (S.stareT > 0 && S.phase === 'done') { S.stareT -= dt; if (S.stareT <= 0) { S.staring = 6; S.stareT = rnd(40, 70); showBanner('……牠們停下來，看著你。', '...They stopped. They are looking at you.', 3600); } }
  if (S.staring > 0) S.staring -= dt;
  for (const c of S.creatures.slice()) updateCreature(c, dt);
  if (auto()) { S.plannerT -= dt; if (S.plannerT <= 0) { S.plannerT = 2; planner(); } S.rolesT -= dt; if (S.rolesT <= 0) { S.rolesT = 5; ensureRoles(); } S.homesT -= dt; if (S.homesT <= 0) { S.homesT = 3; assignHomes(); } checkDisc(); }
  if (S.phase === 'awake' && !S.ritual) { S.qTimer -= dt; if (S.qTimer <= 0 && S.q < QS.length && !dlgOpen) openQuestion(); }   // 已開著就不要重建按鈕，否則點擊會被吃掉
  if (S.ritual) { S.ritual.t += dt; if (S.ritual.t > 12 && !S.ritual.shown) { S.ritual.shown = true; showResult(); } }
}
function fixOrchards() {   // 舊存檔：田裡的果樹搬到田的兩側，並清掉壓在田上的樹苗
  for (const b of S.builds) if (b.type === 'orchard') {
    const inField = n => n.type === 'tree' && Math.abs(n.x - b.x) < 24 && Math.abs(n.y - b.y) < 15, had = S.nodes.filter(inField).length;
    S.nodes = S.nodes.filter(n => !inField(n));
    if (had && !S.nodes.some(n => n.type === 'tree' && Math.abs(Math.abs(n.x - b.x) - 27) < 3 && Math.abs(n.y - b.y - 10) < 4)) for (const d of [-27, 27]) S.nodes.push({ type: 'tree', x: b.x + d, y: b.y + 10, apple: 2, wood: 0 });
  }
}
function sprout() {   // 成樹會在附近落下種子；同一片地方擠滿了就不長
  const trees = S.nodes.filter(n => n.type === 'tree'); if (trees.length < 4 || trees.length > 150) return;
  const par = pick(trees.filter(n => !(n.g < 1))); if (!par) return;
  const a = rnd(Math.PI*2), r = rnd(14, 34), x = Math.round(par.x + Math.cos(a)*r), y = Math.round(par.y + Math.sin(a)*r*0.7);
  if (x < 12 || x > W - 12 || y < HORIZON + 14 || y > H - 8 || isWater(x, y) || isWater(x, y - 6) || isWater(x, y + 6)) return;
  if (Math.hypot(x - PILE.x, (y - PILE.y)*1.3) < 30 || Math.hypot(x - ROAD.gy.x - 22, y - ROAD.gy.y - 16) < 36) return;
  { const cx = Math.floor(x/CS), cy = Math.floor(y/CS); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if (RD[(cy + b)*GW + cx + a]) return; }   // 不長在路上
  if (S.plan && Math.hypot(S.plan.x - x, S.plan.y - y) < 22) return;
  for (const b of S.builds) if (Math.hypot(b.x - x, b.y - y) < 20 || (b.type === 'orchard' && Math.abs(b.x - x) < 25 && Math.abs(b.y - y) < 15)) return;
  for (const n of S.nodes) if (Math.hypot(n.x - x, n.y - y) < 11) return;
  S.nodes.push({ type: 'tree', x, y, apple: 0, wood: 0, g: 0 });
}
function dieOld(c) {   // 壽終：留下墓碑，附近的小生物去送行
  const g = ROAD.gy, k = S.graves.length % 30, n = nameOf(c), yrs = (c.age/DAY).toFixed(1);
  S.creatures.splice(S.creatures.indexOf(c), 1); S.stats.aged = (S.stats.aged || 0) + 1; if (sel === c.id) sel = null;
  S.graves.push({ x: g.x + (k % 6)*8, y: g.y + Math.floor(k/6)*7, n, gen: c.gen || 1 }); if (S.graves.length > 30) S.graves.shift();
  for (const o of S.creatures.filter(o => o.age >= 25 && o.st !== 'sleep' && !o.carry && !o.flee).sort((a, b) => dist(a, c) - dist(b, c)).slice(0, 4)) goto(o, 'mourn', g.x + rnd(0, 40), g.y + 32 + rnd(0, 8));
  if (S.stats.aged === 1) addHist(`第一位長者壽終：${n}（享年 ${yrs} 天）。`, `The first elder passed away: ${n} (age ${yrs} d).`, 'heart');
  if (c.gen === 1 && S.stats.aged > 1) addHist(`最初的那一隻——${n}——壽終正寢。`, `The very first one, ${n}, passed away.`, 'heart');
  if (c.gen === 1 || pop() < 60) logMsg(`${n} 壽終正寢了（享年 ${yrs} 天）`, `${n} passed away peacefully (age ${yrs} d)`);
  if (c.gen === 1 && S.stats.aged === 1) showBanner(`最初的那一隻——${n}——壽終正寢了。`, `The very first one, ${n}, has passed away.`, 4200, 'heart');
  sfx.no();
}
function updateCreature(c, dt) {
  c.age += dt;
  if (!S.ritual && c.age >= c.life && pop() > 3) { dieOld(c); return; } if (c.bubT > 0) c.bubT -= dt; if (c.cool > 0) c.cool -= dt;
  const slow = c.st === 'sleep' ? 0.3 : 1;
  c.h = clamp(c.h - 1.0*dt*slow, 0, 100); c.c = clamp(c.c - 0.35*dt*slow, 0, 100); c.f = clamp(c.f - 0.6*dt*slow, 0, 100);
  const low = Math.min(c.h, c.c, c.f) < 15;
  if (low && !c.neg) { c.neg = true; S.stats.neglect++; } else if (!low && Math.min(c.h, c.c, c.f) > 30) c.neg = false;
  if (c.h <= 0) { c.hz += dt; if (c.hz > 45 && pop() > 1) { die(c); return; } } else c.hz = 0;
  // 繁殖：三種需求都滿足一段時間就會分裂
  const foodOk = pop() < 40 || S.stock.apple >= Math.min(pop()*0.9, 400);   // 糧食吃緊時不再生育：人口會隨長者壽終慢慢回落，而不是餓死一大片
  if (c.age > 25 && pop() < capacity() && foodOk && Math.min(c.h, c.c, c.f) > 55) c.happyT += dt; else c.happyT = 0;
  c.cd -= dt;
  if (c.happyT > 8 && c.cd <= 0) spawn(c);
  if (S.ritual) { moveTo(c, c.tx, c.ty, 45, dt); return; }
  if (dlgOpen || S.staring > 0) return;
  if (c.st === 'sleep') { if (darkness() < 0.45 || c.h < 25) { c.st = 'idle'; c.tt = 0.5; } return; }
  if (c.flee > 0) { c.flee -= dt; const dx = c.x - mouse.x, dy = c.y - mouse.y, d = Math.hypot(dx, dy) || 1; c.x = clamp(c.x + dx/d*40*dt, 8, W - 8); c.y = clamp(c.y + dy/d*40*dt, YMIN, H - 6); return; }
  if (c.st === 'idle') { c.tt -= dt; if (c.tt <= 0) think(c); }
  else if (c.st === 'walk') { c.wt -= dt; if (moveTo(c, c.tx, c.ty, c.age < 25 ? 16 : c.age > c.life*0.85 ? 15 : 22, dt) < 3) arrive(c); else if (c.wt <= 0) { c.st = 'idle'; c.goal = null; c.tt = 0.5; } }
  else if (c.st === 'act') {
    const g = c.goal || {};
    if (g.type === 'build') { if (!S.plan) { c.st = 'idle'; c.goal = null; c.tt = 0.3; } else { S.plan.prog += dt*(S.disc.tools ? 1.3 : 1)/S.plan.time; if (S.plan.prog >= 1) completePlan(); } }
    else if (g.type === 'study') { S.knowledge += dt*0.5; c.tt -= dt; if (c.tt <= 0) finish(c, dt); }
    else if (g.type === 'wash') { c.c = clamp(c.c + dt*22, 0, 100); c.tt -= dt; if (c.tt <= 0) finish(c, dt); }
    else { c.tt -= dt; if (c.tt <= 0) finish(c, dt); }
  }
  if (Math.random() < dt*0.03 && c.bubT <= 0 && S.creatures.filter(o => o.bubT > 0).length < 6) say(c, chatter(c));
}
function spawn(p) {
  const c = mkCreature(p.x + rnd(-8, 8), p.y + rnd(-5, 5), Math.random() < 0.55 ? p.role : pickRole());
  c.h = 60; c.c = 70; c.f = 60; c.par = p.id; c.gen = (p.gen || 1) + 1; S.creatures.push(c);
  p.cd = 15; p.happyT = 0; p.h = clamp(p.h - 25, 0, 100); p.f = clamp(p.f - 10, 0, 100);
  S.stats.born++; if (c.gen % 5 === 0 && !(S.gm || {})[c.gen]) { (S.gm = S.gm || {})[c.gen] = 1; addHist(`傳到了第 ${c.gen} 代。`, `Reached generation ${c.gen}.`, 'heart'); }
  sfx.spawn(); say(p, '@spark');
  if (pop() % 5 === 0 || pop() <= 3) logMsg(`新的小生命誕生了（${pop()}）`, `A new life was born (${pop()})`);
}
function die(c) {
  S.creatures.splice(S.creatures.indexOf(c), 1); S.stats.died++; if (sel === c.id) sel = null;
  if (S.stats.died === 1) addHist('第一次有小生物餓死了。', 'The first creature starved.', 'no'); logMsg('有一隻小生物餓死了……', 'One of them starved...'); sfx.no();
}

// ---------- 社會：規劃、角色、發現 ----------
function afford(cost) { return S.stock.wood >= cost.wood && S.stock.stone >= cost.stone; }
function planner() {
  if (S.plan) return;
  const has = t => S.builds.some(b => b.type === t);
  // 優先順序：里程碑（紀念碑、圖書館）> 營火與果園 > 房屋。否則人口一直逼近上限，房子會蓋不完，里程碑永遠排不到
  let type = null;
  if (S.disc.writing && !has('monument') && pop() >= 22) type = 'monument';
  else if (S.disc.language && !has('library')) type = 'library';
  else if (S.disc.fire && !has('fire')) type = 'fire';
  else if (S.disc.farming && S.builds.filter(b => b.type === 'orchard').length < Math.min(12, 2 + Math.floor(pop()/40))) type = 'orchard';
  else if (pop() >= capacity() - 2) type = S.disc.tools ? 'house' : 'hut';
  if (!type || type === 'hut' || type === 'house') {   // 便利設施：買得起、條件到了就先蓋（蓋不出來的 90 秒內不再試）
    const ok = { well: pop() >= 10, dock: pop() >= 12, storage: pop() >= 14, mill: pop() >= 16 && has('orchard'), market: pop() >= 20 };
    const am = ['well', 'dock', 'storage', 'mill', 'market'].find(t => ok[t] && S.disc[BUILD[t].need] && !has(t) && afford(BUILD[t].cost) && ((S.noAm || {})[t] || 0) < S.t);
    if (am) type = am;
  }
  if (!type || !afford(BUILD[type].cost)) return;   // 里程碑買不起時就等，先存資源，不讓房子把資源花掉
  const site = findSite(type);
  if (!site) { if (BUILD[type].need) (S.noAm = S.noAm || {})[type] = S.t + 90; return; }
  S.stock.wood -= BUILD[type].cost.wood; S.stock.stone -= BUILD[type].cost.stone;
  S.plan = { type, x: site.x, y: site.y, dx: site.dx, dy: site.dy, prog: 0, time: BUILD[type].time }; clearLand(site.x, site.y + 2, type === 'orchard' ? 22 : 13);
  logMsg(`開始興建${BUILD[type].zh}`, `Started building a ${BUILD[type].en}`);
}
function completePlan() {
  const p = S.plan; S.plan = null;
  S.builds.push({ type: p.type, x: p.x, y: p.y, dx: p.dx, dy: p.dy, done: true, t: S.t, occ: [] });
  const nT = S.builds.filter(b => b.type === p.type).length, bn2 = BUILD[p.type];
  if (nT === 1) addHist(`蓋好了第一座${bn2.zh}。`, `Built the first ${bn2.en}.`); else if ((p.type === 'house' || p.type === 'hut') && nT % 10 === 0) addHist(`第 ${nT} 棟${bn2.zh}落成。`, `The ${nT}th ${bn2.en} was finished.`);
  connectRoad(S.builds[S.builds.length - 1]); rebuildRoads();   // 從新房子的門口走出一條路，接到最近的路
  if (p.type === 'orchard') for (const d of [-27, 27]) S.nodes.push({ type: 'tree', x: p.x + d, y: p.y + 10, apple: 2, wood: 0 });
  sfx.disc(); logMsg(`${BUILD[p.type].zh}完成了！`, `The ${BUILD[p.type].en} is finished!`);
  if (p.type === 'monument') awaken();
}
function assignHomes() {   // 每隻小生物住進有空位的房子；晚上會走回自己家門口睡
  const homes = S.builds.filter(b => (b.type === 'hut' || b.type === 'house') && b.done);
  for (const h of homes) h.occ = (h.occ || []).filter(id => S.creatures.some(c => c.id === id));
  for (const c of S.creatures) {
    if (c.home && homes.includes(c.home) && c.home.occ.includes(c.id)) continue;
    c.home = null; const pr = c.par && S.creatures.find(o => o.id === c.par), h = (pr && pr.home && homes.includes(pr.home) && pr.home.occ.length < BUILD[pr.home.type].cap) ? pr.home : homes.find(h => h.occ.length < BUILD[h.type].cap);   // 優先住進父母的家
    if (h) { h.occ.push(c.id); c.home = h; }
  }
}
function ensureRoles() {   // 依比例分配職業：只從「超過配額」的職業轉出，所以採集者不會被抽光
  const n = pop();
  const want = { forager: Math.ceil(n*0.45), builder: Math.max(2, Math.round(n*0.15)), thinker: n >= 12 ? Math.max(2, Math.round(n*0.1)) : 0, lumber: Math.max(2, Math.round(n*0.15)), miner: Math.max(2, Math.round(n*0.1)),
    farmer: 2*S.builds.filter(b => b.type === 'orchard' && b.done).length, fisher: n >= 10 ? 2*S.builds.filter(b => b.type === 'dock' && b.done).length : 0 };
  const adults = S.creatures.filter(c => c.age >= 25 && !c.carry && c.st !== 'act');
  for (const r of ROLES) {
    let have = count(r);
    while (have < want[r]) { const d = adults.filter(c => c.role !== r && count(c.role) > want[c.role]).sort(() => Math.random() - 0.5)[0]; if (!d) break; d.role = r; have++; }
  }
}
function checkDisc() {
  const d = S.disc, give = (k, zh, en) => { d[k] = true; addHist(`發現了「${DISC[k].zh}」。`, `Discovered ${DISC[k].en}.`, DISC[k].ic); sfx.disc(); logMsg(`發現了「${DISC[k].zh}」！`, `Discovered ${DISC[k].en}!`); showBanner(`發現了${DISC[k].zh}`, `They discovered ${DISC[k].en}`, 3200, DISC[k].ic); };
  if (!d.tools && S.tot.wood >= 10) give('tools');
  else if (d.tools && !d.fire && S.tot.stone >= 8) give('fire');
  else if (d.tools && !d.farming && S.tot.apple >= 50) give('farming');
  else if (d.fire && !d.language && count('thinker') >= 2 && pop() >= 18) give('language');
  else if (d.language && !d.writing && S.builds.some(b => b.type === 'library')) give('writing');
}

// ---------- 醒來：紀念碑完成後，小群開始問你問題 ----------

  showBanner('紀念碑亮了。牠們全部轉過頭來，看著你。', 'The monument lit up. They all turned to look at you.', 5000);

}

      S.log = []; S.ritual = null; S.homesT = 0; S.rain = S.rain || 0; S.rainCd = S.rainCd || 100;
      for (const b of S.builds) b.occ = [];
      fixOrchards(); loadRoads(); rebuildRoads();
      if (S.phase === 'awake' && S.q >= QS.length) S.phase = 'done';
      return true;
    }
  } catch (e) {}
  return false;
}

// ---------- 主迴圈 ----------
let last = performance.now(), acc = 0;
const ground2 = document.createElement('canvas'); ground2.width = W; ground2.height = H; let fade = 0, curSea = -1;
function checkSeason(announce) {   // 季節一換，就重畫地表並交叉淡入
  const se = season(); if (se === curSea) return;
  if (announce && curSea >= 0) { snapGround(); showBanner(SEA_NAME[se][0] + '天來了', SEA_NAME[se][1] + ' has come', 2600); logMsg(SEA_NAME[se][0] + '天來了', SEA_NAME[se][1] + ' has come'); }
  if (announce && curSea >= 0 && S.hist) { const yr = Math.floor(S.t/(SEASON_LEN*4)); S.hs = S.hs || {};
    if (se === 3 && !S.hs['w' + yr]) { S.hs['w' + yr] = 1; addHist(`第 ${yr + 1} 個冬天來臨。`, `Winter ${yr + 1} arrived.`); }
    if (se === 0 && yr > 0 && !S.hs['s' + yr]) { S.hs['s' + yr] = 1; addHist(`度過了第 ${yr} 個冬天，春天回來了。`, `Survived winter ${yr}. Spring returned.`, 'sun'); } }
  curSea = se; applyWater(TIDE[se] + evTide()); buildGround();
}
function frame(now) {
  // 對話框開著時時間暫停：否則加速時，小生物會在你思考時餓死
  const dt = Math.min(0.25, (now - last)/1000); last = now;
  if (!paused && !resOpen && !dlgOpen && !histOpen) { const tk = speed >= 30 ? 0.1 : speed >= 10 ? 1/15 : TICK; acc += dt*speed; let n = 0; while (acc >= tk && n++ < 600) { step(tk); acc -= tk; } if (acc > tk*600) acc = 0; }   // 越快，每一步越粗，運算量反而不增加
  if (sel != null && S && cam.z > 1 && !pan) { const c = S.creatures.find(o => o.id === sel); if (c) { cam.x += (c.x - W/cam.z/2 - cam.x)*0.15; cam.y += (c.y - H/cam.z/2 - cam.y)*0.15; clampCam(); } }   // 放大時鏡頭跟著被查看的小生物
  if (S) checkSeason(true); fade = Math.max(0, fade - dt/1.6);
  audioTick(); render(now/1000); updateHud();
  requestAnimationFrame(frame);
}
const qs = new URLSearchParams(location.search);
if (qs.get('seed') || !load()) newGame(+qs.get('seed') || undefined);
if (+qs.get('speed')) speed = +qs.get('speed');
buildUI();
try { if (!localStorage.getItem('sw-seen') && qs.get('intro') !== '0') $('intro').hidden = false; else startHint(); } catch (e) {}
setInterval(save, 8000);
addEventListener('beforeunload', save);
(function () {   // 像素滑鼠游標（放大兩倍）與網站圖示
  const a = icCanvas('arrow'), c = document.createElement('canvas'); c.width = a.width*2; c.height = a.height*2;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(a, 0, 0, c.width, c.height);
  document.documentElement.style.setProperty('--cur', `url(${c.toDataURL()}) 0 0, auto`);
  document.querySelector('link[rel=icon]').href = icCanvas('chick').toDataURL();
})();
const startLoop = () => { fit(); requestAnimationFrame(frame); };   // 像素字體是嵌在檔案裡的，載入很快；最多等 1.5 秒
try { Promise.race([document.fonts.load('12px Cubic11'), new Promise(r => setTimeout(r, 1500))]).then(startLoop, startLoop); } catch (e) { startLoop(); }
</script>
